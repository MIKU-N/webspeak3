name: Bug Report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in as much detail as you can.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: e.g. The Connect dialog closes unexpectedly when I select text inside it.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Open the Connect dialog
        2. Click and drag to select the server address text
        3. Release the mouse outside the dialog
        4. Dialog closes unexpectedly
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: false

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome / Chromium
        - Firefox
        - Safari
        - Edge
        - Other (mention in description)
    validations:
      required: true

  - type: input
    id: deployment
    attributes:
      label: Deployment method
      description: How are you running WebSpeak3?
      placeholder: e.g. Docker Hub image moepchi/webspeak3:latest, built from source, docker-compose
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Docker tag, commit hash, or release version if known
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / console output
      description: Browser console errors, gateway logs, or connector output, if any.
      render: shell
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Screenshots, TeamSpeak server version, anything else relevant.
    validations:
      required: false
